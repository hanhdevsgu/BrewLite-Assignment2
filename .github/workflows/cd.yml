name: BrewLite CD Pipeline (Continuous Delivery & Deployment)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delivery-and-deployment:
    name: Build, Package Docker Image, Deploy & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Quality Gate (Install, Lint, Test, Build)
      - name: 1. Run Quality Gate (Install, Lint, Test & Build)
        run: |
          npm ci || npm install
          cd apps/api && (npm ci || npm install) && npm run lint && npm test && npm run build
          cd ../web && (npm ci || npm install) && npm run lint && npm run build

      # 2. Tag image with Commit SHA & Semantic Version
      - name: 2. Generate Image Tags
        id: meta
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VERSION_TAG=${GITHUB_REF_NAME:-$GITHUB_SHA}" >> $GITHUB_ENV

      # 3. Docker Image Build & Push Registry (ghcr.io)
      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Build & Push Docker Images
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_OWNER_LOWER/brewlite-api:${{ env.SHORT_SHA }} -t ghcr.io/$REPO_OWNER_LOWER/brewlite-api:${{ env.VERSION_TAG }} ./apps/api
          docker build -t ghcr.io/$REPO_OWNER_LOWER/brewlite-web:${{ env.SHORT_SHA }} -t ghcr.io/$REPO_OWNER_LOWER/brewlite-web:${{ env.VERSION_TAG }} ./apps/web
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker push ghcr.io/$REPO_OWNER_LOWER/brewlite-api:${{ env.SHORT_SHA }}
            docker push ghcr.io/$REPO_OWNER_LOWER/brewlite-api:${{ env.VERSION_TAG }}
            docker push ghcr.io/$REPO_OWNER_LOWER/brewlite-web:${{ env.SHORT_SHA }}
            docker push ghcr.io/$REPO_OWNER_LOWER/brewlite-web:${{ env.VERSION_TAG }}
          fi

      # 4. Safe Database Migration & Deploy Hook
      - name: 6. Safe Database Migration & Deploy Trigger
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          cd apps/api
          npx prisma validate
          if [ -n "$DATABASE_URL" ]; then
            npx prisma migrate deploy
          else
            echo "DATABASE_URL secret not configured — schema validated; skipping remote migrate deploy."
          fi
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "DEPLOY_WEBHOOK_URL secret not configured — skipping remote deploy hook."
          fi

      # 5. Health Check & Smoke Test
      - name: 7. Automated Post-Deployment Smoke Test
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        run: |
          if [ -n "$PROD_HEALTH_URL" ]; then
            echo "Executing Smoke Test on $PROD_HEALTH_URL..."
            RESPONSE=$(curl -fsSL "$PROD_HEALTH_URL")
            echo "$RESPONSE"
            echo "$RESPONSE" | grep -q '"status":"ok"'
          else
            echo "PROD_HEALTH_URL secret not configured — running full-stack Docker Compose container smoke test..."
            docker compose up -d --build
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/api/health | grep -q '"database":"connected"'; then
                echo "API Health Check passed:"
                curl -s http://127.0.0.1:3001/api/health
                echo ""
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose logs --tail=50
                docker compose down -v
                exit 1
              fi
              sleep 3
            done
            curl -fsSI http://127.0.0.1:3000 | head -n 5
            docker compose down -v
          fi

      # 6. Rollback Mechanism (Triggered on Failure)
      - name: 8. Rollback Trigger (On Failure)
        if: failure()
        run: |
          docker compose down -v || true
          echo "========================================================="
          echo "🚨 CRITICAL: DEPLOYMENT OR SMOKE TEST FAILED!"
          echo "Kích hoạt cơ chế Rollback tự động về phiên bản trước đó..."
          echo "Xem chi tiết hướng dẫn Rollback tại: docs/rollback-guide.md"
          echo "========================================================="
          exit 1
