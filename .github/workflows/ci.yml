name: BrewLite CI Pipeline (Continuous Integration)

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

jobs:
  quality-gate:
    name: Install, Lint, Test & Build Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewlite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 1: Install Dependencies
      - name: 1. Install Root & API Dependencies
        run: |
          npm ci || npm install
          cd apps/api && (npm ci || npm install)

      - name: 2. Install Web Dependencies
        run: |
          cd apps/web && (npm ci || npm install)

      # Step 2: Linting & Type Check (Strict Quality Gate)
      - name: 3. Run Lint Checks (API & Web)
        run: |
          cd apps/api && npx prisma generate && npm run lint
          cd ../web && npm run lint

      # Step 3: Database Migration & Seed Verification
      - name: 4. Run Prisma Migrations & Seed on Test DB
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/brewlite_db?schema=public"
          JWT_SECRET: "brewlite_super_secret_jwt_key_2026"
        run: |
          cd apps/api
          npx prisma migrate deploy
          npm run seed

      # Step 4: Unit & Integration Tests (Jest + Supertest)
      - name: 5. Execute API Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/brewlite_db?schema=public"
          JWT_SECRET: "brewlite_super_secret_jwt_key_2026"
        run: |
          cd apps/api
          npm test
          npm run test:e2e

      # Step 5: Production Build Verification
      - name: 6. Build API Application (NestJS)
        run: |
          cd apps/api
          npm run build

      - name: 7. Build Web Application (Next.js PWA)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
        run: |
          cd apps/web
          npm run build
